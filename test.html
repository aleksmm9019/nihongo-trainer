<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>tests</title></head>
<body>
<main id="view"></main>
<pre id="out"></pre>
<script src="data/dict.js"></script>
<script src="data/vocab.js"></script>
<script src="data/kanji.js"></script>
<script src="data/verbs.js"></script>
<script src="data/particles.js"></script>
<script src="data/grammar.js"></script>
<script src="data/sentences.js"></script>
<script src="app.js"></script>
<script>
const results = [];
function eq(actual, expected, name) {
  results.push((actual === expected ? "PASS " : `FAIL [${actual}] != [${expected}] `) + name);
}

// godan basics
eq(conjugate("のむ","godan","masu"), "のみます", "nomu masu");
eq(conjugate("のむ","godan","te"), "のんで", "nomu te");
eq(conjugate("のむ","godan","ta"), "のんだ", "nomu ta");
eq(conjugate("のむ","godan","nai"), "のまない", "nomu nai");
eq(conjugate("かう","godan","nai"), "かわない", "kau nai (u->wa)");
eq(conjugate("かう","godan","te"), "かって", "kau te");
eq(conjugate("まつ","godan","te"), "まって", "matsu te");
eq(conjugate("しぬ","godan","te"), "しんで", "shinu te");
eq(conjugate("あそぶ","godan","te"), "あそんで", "asobu te");
eq(conjugate("かく","godan","te"), "かいて", "kaku te");
eq(conjugate("およぐ","godan","te"), "およいで", "oyogu te");
eq(conjugate("およぐ","godan","ta"), "およいだ", "oyogu ta");
eq(conjugate("はなす","godan","te"), "はなして", "hanasu te");
eq(conjugate("はなす","godan","ta"), "はなした", "hanasu ta");
// godan -ru and trap verbs
eq(conjugate("はしる","godan","masu"), "はしります", "hashiru masu");
eq(conjugate("かえる","godan","te"), "かえって", "kaeru te (trap verb)");
eq(conjugate("はいる","godan","nai"), "はいらない", "hairu nai (trap verb)");
// irregular godan
eq(conjugate("いく","godan","te"), "いって", "iku te (irregular)");
eq(conjugate("いく","godan","ta"), "いった", "iku ta (irregular)");
eq(conjugate("ある","godan","nai"), "ない", "aru nai (irregular)");
// ichidan
eq(conjugate("たべる","ichidan","masu"), "たべます", "taberu masu");
eq(conjugate("たべる","ichidan","te"), "たべて", "taberu te");
eq(conjugate("たべる","ichidan","nai"), "たべない", "taberu nai");
eq(conjugate("おきる","ichidan","ta"), "おきた", "okiru ta");
// suru / kuru
eq(conjugate("する","suru","masu"), "します", "suru masu");
eq(conjugate("べんきょうする","suru","ta"), "べんきょうした", "benkyou-suru ta");
eq(conjugate("べんきょうする","suru","nai"), "べんきょうしない", "benkyou-suru nai");
eq(conjugate("くる","kuru","nai"), "こない", "kuru nai");
eq(conjugate("くる","kuru","mashita"), "きました", "kuru mashita");

// data integrity: unique ids
for (const [name, deck] of [["VOCAB", VOCAB], ["KANJI", KANJI]]) {
  const ids = new Set(deck.map(x => x.id));
  eq(ids.size, deck.length, name + " ids unique");
}
// every particle answer is well-formed
const POOL = ["は","が","を","に","で","へ","と","から","まで","も","の","か"];
eq(PARTICLES.filter(p => !p.twoBlanks && !POOL.includes(p.a)).length, 0, "particle answers in pool");
eq(PARTICLES.filter(p => !p.s.includes("＿")).length, 0, "all particle sentences have a blank");
// furigana markup: brackets balanced, readings are pure kana, no kanji left unannotated
const KANJI_RE = /[一-鿿々]/;
let badRuby = [];
for (const p of PARTICLES) {
  const stripped = p.s.replace(/([一-鿿々]+)\[([^\]]+)\]/g, (m, k, yomi) => /^[ぁ-ゖー]+$/.test(yomi) ? "" : m);
  if (KANJI_RE.test(stripped) || stripped.includes("[") || stripped.includes("]")) badRuby.push(p.s);
}
eq(badRuby.join(" | "), "", "all particle kanji carry kana readings");
// rubify produces ruby tags, and strips cleanly when furigana is off
eq(rubify("私[わたし]です"), "<ruby>私<rt>わたし</rt></ruby>です", "rubify on");
S.settings.furigana = false;
eq(rubify("私[わたし]です"), "私です", "rubify off");
S.settings.furigana = true;
// every verb type is known
eq(VERBS.filter(v => !["godan","ichidan","suru","kuru"].includes(v.type)).length, 0, "verb types valid");
// romaji conversion
eq(romajiToKana("oyogu"), "およぐ", "romaji oyogu");
eq(romajiToKana("gakkou"), "がっこう", "romaji double consonant");
eq(romajiToKana("shashin"), "しゃしん", "romaji sha + n at end");
eq(romajiToKana("benkyou"), "べんきょう", "romaji n before consonant + kyo");
eq(romajiToKana("matte"), "まって", "romaji sokuon");
eq(romajiToKana("nihongo"), "にほんご", "romaji n before consonant");
eq(romajiToKana("ramen"), "らめん", "romaji trailing n");
eq(romajiToKana("kin'youbi"), "きんようび", "romaji n-apostrophe");
eq(romajiToKana("juu"), "じゅう", "romaji ju");
// verb type detection
eq(guessVerbType("泳ぐ", "およぐ"), "godan", "guess oyogu godan");
eq(guessVerbType("食べる", "たべる"), "ichidan", "guess taberu ichidan");
eq(guessVerbType("帰る", "かえる"), "godan", "guess kaeru trap godan");
eq(guessVerbType("変える", "かえる"), "ichidan", "guess kaeru (change) ichidan");
eq(guessVerbType("勉強する", "べんきょうする"), "suru", "guess suru verb");
eq(guessVerbType("来る", "くる"), "kuru", "guess kuru");
eq(guessVerbType("作る", "つくる"), "godan", "guess tsukuru godan (u-row before ru)");
// dictionary search
eq(searchDict("oyogu")[0].w, "泳ぐ", "dict search romaji");
eq(searchDict("泳ぐ")[0].k, "およぐ", "dict search kanji");
eq(searchDict("to swim")[0].w, "泳ぐ", "dict search english");
eq(searchDict("").length, 0, "dict search empty");
// kana normalization: katakana + long-vowel mark match by-ear romaji
eq(normKana("コーヒー"), "こおひい", "normKana katakana long vowel");
eq(normKana("およぐ"), "およぐ", "normKana hiragana untouched");
eq(searchDict("koohii")[0].w, "コーヒー", "dict search loanword by ear");
eq(searchDict("ko-hi-")[0].w, "コーヒー", "dict search loanword with - for ー");
// deconjugation: conjugated input finds the dictionary form
eq(deconjugate("つくります").has("つくる"), true, "deconj masu godan");
eq(deconjugate("たべました").has("たべる"), true, "deconj mashita ichidan");
eq(deconjugate("のんで").has("のむ"), true, "deconj te-form");
eq(deconjugate("いかない").has("いく"), true, "deconj nai godan");
eq(deconjugate("べんきょうします").has("べんきょう"), true, "deconj suru-verb noun");
eq(deconjugate("たかかった").has("たかい"), true, "deconj i-adjective past");
eq(searchDict("tsukurimasu")[0].w, "作る", "dict search polite form");
eq(searchDict("tabemashita")[0].w, "食べる", "dict search past polite");
eq(searchDict("nonde")[0].w, "飲む", "dict search te-form");
eq(searchDict("benkyoushimasu")[0].w, "勉強", "dict search suru-verb");
eq(searchDict("itte").some(h => h.w === "行く"), true, "dict search itte finds iku");
eq(searchDict("tsukurimasu")[0].via, true, "deconj hits are flagged");
eq(searchDict("oyogu")[0].via, false, "direct hits not flagged");
// dictionary integrity
eq(DICT.length > 20000, true, "dict has 20000+ entries");
eq(DICT.filter(d => d.length !== 4 || ![0,1,2,3,4,5].includes(d[3])).length, 0, "dict rows well-formed");
for (const lvl of [5,4,3,2,1,0]) eq(DICT.some(d => d[3] === lvl), true, "dict has N" + lvl + " entries");
// inbox
eq(Array.isArray(S.inbox), true, "inbox initialised");
// speech text generation
eq(stripRuby("私[わたし]は学生[がくせい]です"), "私は学生です", "stripRuby");
eq(particleSpeakText({s:"水[みず]＿飲[の]みます。", a:"を"}), "水を飲みます。", "particle speak text");
eq(particleSpeakText({s:"九時[くじ]＿五時[ごじ]＿働[はたら]きます。", a:"から/まで", twoBlanks:true}), "九時から五時まで働きます。", "two-blank speak text");
// card modes: new cards and kanji always recognition
S.cards["v001"] = newCardState();
eq(cardMode("v001"), "recog", "new card -> recognition");
S.cards["k001"] = newCardState(); S.cards["k001"].reps = 5;
eq(cardMode("k001"), "recog", "kanji always recognition");
S.cards["v001"].reps = 5;
S.settings.prodCards = false; S.settings.listenCards = false;
eq(cardMode("v001"), "recog", "modes off -> recognition");
delete S.cards["v001"]; delete S.cards["k001"];
S.settings.prodCards = true; S.settings.listenCards = true;
// grammar data integrity
eq(new Set(GRAMMAR.map(g => g.id)).size, GRAMMAR.length, "grammar ids unique");
eq(GRAMMAR.filter(g => !g.id.startsWith("g")).length, 0, "grammar ids start with g");
eq(GRAMMAR.filter(g => g.questions.some(q => !q.choices.includes(q.a))).length, 0, "every grammar answer is among its choices");
eq(GRAMMAR.filter(g => g.questions.some(q => !q.q.includes("＿＿"))).length, 0, "every grammar question has a blank");
eq(GRAMMAR.filter(g => g.questions.some(q => new Set(q.choices).size !== q.choices.length)).length, 0, "grammar choices have no duplicates");
// all grammar kanji annotated with readings (questions + examples)
let badG = [];
for (const g of GRAMMAR) {
  for (const s of [...g.questions.map(q => q.q), ...g.examples.map(e => e[0])]) {
    const stripped = s.replace(/([一-鿿々]+)\[([^\]]+)\]/g, (m, k, yomi) => /^[ぁ-ゖー]+$/.test(yomi) ? "" : m);
    if (/[一-鿿々]/.test(stripped) || stripped.includes("[")) badG.push(s);
  }
}
eq(badG.join(" | "), "", "all grammar kanji carry kana readings");
// grammar scheduling: id routing and due/new logic
eq(deckOf("g001"), "grammar", "deckOf grammar");
eq(itemById("g001").id, "g001", "itemById finds grammar");
S.cards["g001"] = newCardState();
eq(dueCards().includes("g001"), false, "grammar excluded from flashcard queue");
eq(dueGrammar().includes("g001"), true, "grammar due in its own queue");
delete S.cards["g001"];
// sentence data integrity
eq(SENTENCES.length >= 300, true, "300+ sentences");
eq(SENTENCES.filter(s => s.length !== 3).length, 0, "sentence rows well-formed");
eq(SENTENCES.filter(([jp, en, t]) => !jp.includes(t)).length, 0, "cloze target present in every sentence");
// voice ranking: natural > enhanced/siri > google > offline-default
const mk = (name, local) => ({ name, localService: local });
eq(voiceScore(mk("Microsoft Nanami Online (Natural)", false)) > voiceScore(mk("Kyoko (Enhanced)", true)), true, "natural beats enhanced");
eq(voiceScore(mk("Kyoko (Enhanced)", true)) > voiceScore(mk("Google 日本語", false)), true, "enhanced beats google");
eq(voiceScore(mk("Google 日本語", false)) > voiceScore(mk("Microsoft Haruka", true)), true, "google beats plain local");
// SRS sanity
const c = newCardState();
gradeCard(c, 2); eq(c.ivl, 1, "new card Good -> 1 day");
gradeCard(c, 2); eq(c.ivl, 3, "second Good -> 3 days");
gradeCard(c, 0); eq(c.ivl, 0, "Again resets interval");

const fails = results.filter(r => r.startsWith("FAIL"));
document.getElementById("out").textContent =
  `TESTRESULT ${fails.length === 0 ? "ALL_PASS" : "FAILURES"} ${results.length - fails.length}/${results.length}\n` + fails.join("\n");
</script>
</body>
</html>
